<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PathGrid – Indoor Navigation</title>
    <meta
      name="description"
      content="PathGrid: accessible, step-free indoor navigation. No login required."
    />
    <meta name="theme-color" content="#0f172a" />

    <!-- Icons (%PUBLIC_URL% keeps paths correct under client-side routing). -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Installable PWA (service worker registered from src/index.js). -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PathGrid" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <noscript>PathGrid needs JavaScript enabled to show indoor maps and routes.</noscript>
    <div id="root"></div>
  </body>
</html>
